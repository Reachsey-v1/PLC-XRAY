# PLC-XRAY Professional Upgrade

This branch contains the professional-grade upgrade for PLC-XRAY v1.2.0, including:

## Features Added

- Evidence-aware metadata model with confidence scoring
- Rich project serialization with metadata, warnings, and evidence
- JSON and Markdown report generation
- Enhanced CLI with `inspect` and `report` commands
- GUI export support for JSON and Markdown
- Expanded test suite for parser, IR, CLI and report generation

## Safety Boundaries

- Read-only project inspection only
- No native GX Works validation is claimed or executed
- No ladder/PDU reverse engineering is attempted
- No download or online write to PLC hardware

## Usage

```bash
python -m plcxray.cli inspect path/to/project.gxw
python -m plcxray.cli report path/to/project.gxw --markdown -o report.md
python PLC-XRAY-GUI.pyw
```

## Testing

```bash
python -m pytest -q
```

